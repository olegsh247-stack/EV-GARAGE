name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: "Cloudflare API Token (вставь сюда, если Secrets пустые)"
        required: false
        type: string
      cloudflare_account_id:
        description: "Cloudflare Account ID"
        required: false
        type: string
        default: "014e0964322f6dcdccc71c59ea49b0ff"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

      - name: Upload OpenNext output
        uses: actions/upload-artifact@v4
        with:
          name: open-next-build
          path: .open-next
          include-hidden-files: true
          retention-days: 2

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID || '014e0964322f6dcdccc71c59ea49b0ff' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Нет токена: укажи cloudflare_api_token при Run workflow или добавь Secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "Account: $CLOUDFLARE_ACCOUNT_ID"
          npx opennextjs-cloudflare deploy
